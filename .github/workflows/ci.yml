name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}   # Windows is supported but not yet verified on real KiCad
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:
          - os: ubuntu-latest      # the current Ubuntu image has no Python 3.9 any more: see test-linux-py39
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v
      - name: Generated reference docs are current
        run: python tools/gen_docs.py --check
      - name: Class systems validate
        run: python -m pcbtestkit classes validate
      - name: KiCad package metadata is valid
        run: python tools/build_pcm.py --check

  test-linux-py39:
    # KiCad's bundled Python is 3.9, so keep testing it on Linux too, in the official Python image
    name: tests (ubuntu container, Python 3.9)
    runs-on: ubuntu-latest
    container: python:3.9-slim
    steps:
      - uses: actions/checkout@v4
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v
      - name: Class systems validate
        run: python -m pcbtestkit classes validate

  package:
    runs-on: ubuntu-latest
    needs: [test, test-linux-py39]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the KiCad Plugin Manager zip
        run: python tools/build_pcm.py
      - name: Build and smoke-test the Python package
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install dist/*.whl
          pcbtestkit --version
          pcbtestkit guide | head -n 3
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' | pcbtestkit-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.zip
            dist/*.whl
            dist/*.tar.gz
            dist/pcm-repository/**
