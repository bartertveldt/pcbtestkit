name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the version
        run: |
          v=$(python -c "import pcbtestkit; print(pcbtestkit.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Build packages
        run: |
          python tools/build_pcm.py
          python -m pip install --upgrade pip build
          python -m build
          cp dist/pcm-repository/packages/*/metadata.json dist/kicad-pcm-metadata.json
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*-kicad-pcm.zip
            dist/kicad-pcm-metadata.json
            dist/*.whl
            dist/*.tar.gz
