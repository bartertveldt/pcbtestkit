name: Release

# A version tag (v1.2.0) builds and publishes the release: the tests first, then the KiCad Plugin and Content
# Manager zip, the Python wheel and sdist, a CycloneDX SBOM, SHA256SUMS and signed build provenance for every file
# (check one with: gh attestation verify <file> --repo bartertveldt/pcbtestkit).

on:
  push:
    tags: ["v*"]

permissions: {}             # nothing by default; the job below asks for what it needs

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub release and upload its files
      id-token: write       # sign the build provenance (Sigstore)
      attestations: write   # store the attestations with the repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check that the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=$(python -c "import pcbtestkit; print(pcbtestkit.__version__)")
          test "v$v" = "$TAG" || { echo "tag $TAG != version v$v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Build the packages (file times from the tagged commit, so the builds are reproducible)
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python tools/build_pcm.py
          python -m pip install "build==1.2.2.post1"
          python -m build
          cp dist/pcm-repository/packages/*/metadata.json dist/kicad-pcm-metadata.json
      - name: SBOM, checksums and release notes
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python tools/sbom.py --out "dist/pcbtestkit-${VERSION}.cdx.json" dist/*-kicad-pcm.zip dist/*.whl dist/*.tar.gz
          cd dist
          sha256sum *-kicad-pcm.zip *.whl *.tar.gz kicad-pcm-metadata.json "pcbtestkit-${VERSION}.cdx.json" > SHA256SUMS
          cat SHA256SUMS
          cd ..
          python tools/release_notes.py "${VERSION}" > dist/RELEASE_NOTES.md
      - name: Signed build provenance for every file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*-kicad-pcm.zip
            dist/*.whl
            dist/*.tar.gz
            dist/kicad-pcm-metadata.json
            dist/*.cdx.json
            dist/SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            dist/*-kicad-pcm.zip
            dist/kicad-pcm-metadata.json
            dist/*.whl
            dist/*.tar.gz
            dist/*.cdx.json
            dist/SHA256SUMS
